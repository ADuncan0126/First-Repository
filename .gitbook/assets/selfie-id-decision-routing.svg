<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Decision routing for capture quality, liveness, similarity and service errors" font-family="Arial,sans-serif"><rect width="800" height="300" rx="24" fill="#eef4fb"/><text x="400" y="41" text-anchor="middle" fill="#142b47" font-size="23" font-weight="700">Use the result of each check to choose the next action</text>
<rect x="32" y="59" width="325" height="42" rx="16" fill="#fff"/><text x="194" y="86" text-anchor="middle" fill="#142b47" font-size="17" font-weight="400">Poor capture</text><path d="M375 80h50m-6-6 6 6-6 6" fill="none" stroke="#3573ad" stroke-width="3" stroke-linecap="round"/><rect x="443" y="59" width="325" height="42" rx="16" fill="#e4f0ff"/><text x="605" y="86" text-anchor="middle" fill="#142b47" font-size="17" font-weight="400">Request a new capture</text><rect x="32" y="114" width="325" height="42" rx="16" fill="#fff"/><text x="194" y="141" text-anchor="middle" fill="#142b47" font-size="17" font-weight="400">Transient SDK error</text><path d="M375 135h50m-6-6 6 6-6 6" fill="none" stroke="#3573ad" stroke-width="3" stroke-linecap="round"/><rect x="443" y="114" width="325" height="42" rx="16" fill="#e4f0ff"/><text x="605" y="141" text-anchor="middle" fill="#142b47" font-size="17" font-weight="400">Retry within a limit</text><rect x="32" y="169" width="325" height="42" rx="16" fill="#fff"/><text x="194" y="196" text-anchor="middle" fill="#142b47" font-size="17" font-weight="400">Failed or inconclusive check</text><path d="M375 190h50m-6-6 6 6-6 6" fill="none" stroke="#3573ad" stroke-width="3" stroke-linecap="round"/><rect x="443" y="169" width="325" height="42" rx="16" fill="#fff0db"/><text x="605" y="196" text-anchor="middle" fill="#142b47" font-size="17" font-weight="400">Review or use another method</text><rect x="32" y="224" width="325" height="42" rx="16" fill="#fff"/><text x="194" y="251" text-anchor="middle" fill="#142b47" font-size="17" font-weight="400">All required checks pass</text><path d="M375 245h50m-6-6 6 6-6 6" fill="none" stroke="#3573ad" stroke-width="3" stroke-linecap="round"/><rect x="443" y="224" width="325" height="42" rx="16" fill="#dcf4e9"/><text x="605" y="251" text-anchor="middle" fill="#142b47" font-size="17" font-weight="400">Continue to the next proofing step</text></svg>
